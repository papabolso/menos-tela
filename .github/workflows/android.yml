name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      # Sem a chave o APK sai com assinatura de teste e não vira Release
      # (cada build teria uma chave diferente e não instalaria por cima do anterior).
      - name: Preparar chave de assinatura
        id: key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::Sem o secret KEYSTORE_BASE64. Rode: python tools/gerar-chave.py"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/menostela.p12"
          echo "path=$RUNNER_TEMP/menostela.p12" >> "$GITHUB_OUTPUT"

      - name: Compilar APK
        working-directory: android
        env:
          KEYSTORE_PATH: ${{ steps.key.outputs.path }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.${{ github.run_number }}
        run: gradle assembleRelease --no-daemon

      - name: Renomear
        run: cp android/app/build/outputs/apk/release/app-release.apk MenosTela.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MenosTela-apk
          path: MenosTela.apk

      - name: Publicar Release
        if: steps.key.outputs.path != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.${{ github.run_number }}" MenosTela.apk \
            --title "Menos Tela 1.${{ github.run_number }}" \
            --notes "Abra este link no celular, baixe o MenosTela.apk e instale." \
            --latest
